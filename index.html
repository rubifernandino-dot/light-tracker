<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="300">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: transparent; padding: 4px; }
  .card { background: #ffffff; border-radius: 18px; padding: 14px; border: 1px solid rgba(60,70,120,0.12); box-shadow: 0 4px 12px rgba(40,50,110,0.06); }
  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .icon-box { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(180deg, #5aa9ff, #007aff); display: grid; place-items: center; color: white; flex-shrink: 0; }
  .title { font-size: 16px; font-weight: 700; color: #111827; }
  .updated { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .inner-box { background: #f6f7fb; border-radius: 12px; padding: 12px; }
  .top-row { display: flex; justify-content: space-between; align-items: center; }
  .badge-queue { background: #ffd60a; color: #111827; font-weight: 700; font-size: 13px; padding: 4px 12px; border-radius: 7px; }
  .badge-duration { background: rgba(255,59,48,0.10); color: #a3000f; font-weight: 600; font-size: 12px; padding: 4px 10px; border-radius: 999px; }
  .divider { height: 1px; background: rgba(60,70,120,0.10); margin: 10px 0; }
  .times-grid { display: flex; flex-wrap: wrap; column-gap: 18px; row-gap: 8px; }
  .time-item { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: #111827; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="icon-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M21 9H3"></path><path d="M21 15H3"></path></svg>
      </div>
      <div>
        <div class="title">График (Степное)</div>
        <div class="updated">Обновлено 13.11 в 13:21</div>
      </div>
    </div>
    <div class="inner-box">
      <div class="top-row">
        <span class="badge-queue">3.2</span>
        <span class="badge-duration">По графику</span>
      </div>
      <div class="divider"></div>
      <div class="times-grid">
        <div class="time-item"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="#f2564d" stroke="#f2564d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"></path></svg><span>03:30 – 04:30</span></div><div class="time-item"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="#f2564d" stroke="#f2564d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"></path></svg><span>09:30 – 12:00</span></div><div class="time-item"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="#f2564d" stroke="#f2564d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"></path></svg><span>15:30 – 18:30</span></div><div class="time-item"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="#f2564d" stroke="#f2564d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"></path></svg><span>21:30 – 23:30</span></div>
      </div>
    </div>
  </div>
</body>
</html>
